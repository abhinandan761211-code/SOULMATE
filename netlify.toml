# Netlify configuration — SoulMate frontend
#
# Frontend only. The API lives on Render (see backend/render.yaml); the browser
# talks to it through VITE_API_URL. Supabase handles auth, Postgres and storage.

[build]
  # All install/build commands run from here
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every unknown path serves index.html so client-side routes
# (/app, /app/journal, /auth/callback ...) survive a hard refresh.
# The root rule is a catch-all, so it must stay last.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache hashed build assets (index-<hash>.js / .css)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached, or updates never reach users
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
