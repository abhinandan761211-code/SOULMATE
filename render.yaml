# Render Blueprint — SoulMate
#
# SoulMate has no backend server: auth, Postgres and storage are Supabase.
# The only thing to deploy is the Vite frontend, served as a static site.
#
# Create the service from this blueprint:
#   Render Dashboard > New > Blueprint > pick this repo
# or edit your existing service's settings to match the values below.
#
# Environment variables (VITE_*) must be set in the Render dashboard and are
# LOCKED here (sync: false) so secrets never land in git.

services:
  - type: web
    name: soulmate
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # SPA fallback — every unknown path serves index.html so client-side
      # routes (/app, /app/journal, /auth/callback ...) survive a refresh.
      - type: rewrite
        source: /*
        destination: /index.html

  # SoulMate API (Python / FastAPI). Root-dir free: Render builds from the repo
  # root, so both the pip install and the gunicorn import path are spelled out
  # here. `--chdir backend` makes the start command work no matter how the
  # service's Root Directory is set in the dashboard.
  - type: web
    name: soulmate-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: gunicorn wsgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 90 --chdir backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
