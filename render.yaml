# Render Blueprint — SoulMate
#
# SoulMate has no backend server: auth, Postgres and storage are Supabase.
# The only thing to deploy is the Vite frontend, served as a static site.
#
# Create the service from this blueprint:
#   Render Dashboard > New > Blueprint > pick this repo
# or edit your existing service's settings to match the values below.
#
# Environment variables (VITE_*) must be set in the Render dashboard and are
# LOCKED here (sync: false) so secrets never land in git.

services:
  - type: web
    name: soulmate
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # SPA fallback — every unknown path serves index.html so client-side
      # routes (/app, /app/journal, /auth/callback ...) survive a refresh.
      - type: rewrite
        source: /*
        destination: /index.html
